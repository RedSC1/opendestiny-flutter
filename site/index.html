<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDestiny | 现代术数排盘方案 - 紫微斗数与八字开源软件</title>
    
    <!-- SEO 关键词堆叠 -->
    <meta name="keywords" content="OpenDestiny, 紫微斗数, 八字排盘, 命理, 术数, 周易, 易经, 真太阳时, 三合盘, 飞星盘, 四化盘, 开源排盘软件, Flutter命理应用, Ziwei Dou Shu, Bazi, Chinese Astrology, Destiny, Open Source Astrology" />
    <meta
      name="description"
      content="OpenDestiny 是一款为现代审美设计的开源术数排盘工具。支持八字、紫微斗数（三合/飞星/四化）三盘联动，内置高精度真太阳时修正与天文历法计算，基于 Flutter 实现全平台丝滑体验。"
    />

    <!-- Open Graph / 社交媒体分享优化 -->
    <meta property="og:title" content="OpenDestiny - 重新定义现代术数排盘体验" />
    <meta property="og:description" content="开源、精准、精美的紫微斗数与八字排盘方案。" />
    <meta property="og:image" content="../assets/images/logo.png" />
    <meta property="og:url" content="https://opendestiny.redsc1.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-vignette"></div>
    <div class="bg-grid"></div>

    <main>
      <!-- Hero Splash Section -->

        <svg class="hero-logo" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color: #fceabb; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #f8b500; stop-opacity: 1" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="85" fill="none" stroke="#8a4bf3" stroke-width="2" opacity="0.8" />
          <circle cx="100" cy="100" r="60" fill="none" stroke="#fccd4d" stroke-width="1.5" stroke-dasharray="4 6" />
          <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="#8a4bf3" stroke-width="2" opacity="0.8" transform="rotate(30 100 100)" />
          <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="#8a4bf3" stroke-width="2" opacity="0.8" transform="rotate(-30 100 100)" />
          <path fill="url(#goldGradient)" d="M100 65L108 92H135L113 108L121 135L100 118L79 135L87 108L65 92H92L100 65Z" />
          <circle cx="150" cy="65" r="3" fill="#fbdf93" opacity="0.9" />
          <circle cx="50" cy="135" r="2.5" fill="#fccd4d" />
          <circle cx="160" cy="120" r="1.5" fill="#fccd4d" />
        </svg>

        <div class="hero-brand">
          <span class="open">Open</span>
          <span class="destiny">Destiny</span>
        </div>

        <div class="hero-actions">
          <a class="button button-doc" href="https://github.com/RedSC1/opendestiny-flutter" target="_blank" rel="noreferrer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub
          </a>
          <a class="button button-site" href="https://opendestiny.redsc1.com/app" target="_blank" rel="noreferrer">现在排盘</a>
        </div>

        <a href="#content" class="scroll-indicator" aria-label="向下滚动">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
          </svg>
        </a>
      </section>

      <!-- Content Section -->
      <div class="page-shell" id="content">
        <section class="section">
          <div class="section-heading">
            <h2>实机截图</h2>
          </div>
          <div class="gallery">
            <figure class="gallery-card">
              <img src="../assets/images/screenshot_1.jpg" alt="八字界面" />
            </figure>
            <figure class="gallery-card">
              <img src="../assets/images/screenshot_2.jpg" alt="紫微界面" />
            </figure>
            <figure class="gallery-card">
              <img src="../assets/images/screenshot_3.jpg" alt="盘式切换" />
            </figure>
            <figure class="gallery-card">
              <img src="../assets/images/screenshot_4.jpg" alt="飞星盘" />
            </figure>
            <figure class="gallery-card">
              <img src="../assets/images/screenshot_5.jpg" alt="四化盘" />
            </figure>
          </div>
        </section>

        <section class="section">
          <div class="section-heading">
            <h2>核心特性</h2>
          </div>
          <div class="feature-grid">
            <article class="feature-card">
              <h3>三盘支持</h3>
              <p>完整支持三合、飞星、四化紫微盘式，实时切换联动。</p>
            </article>
            <article class="feature-card">
              <h3>真太阳时</h3>
              <p>高精度天文历法逻辑，自动修正经度差与真太阳时。</p>
            </article>
            <article class="feature-card">
              <h3>跨端方案</h3>
              <p>基于 Flutter 驱动，在移动、桌面与 Web 端拥有一致体验。</p>
            </article>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 OpenDestiny</p>
    </footer>
  </body>
</html>
